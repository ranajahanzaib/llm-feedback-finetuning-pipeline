[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "llm-feedback-finetuning-pipeline"
version = "0.1.0"
description = "Turn business corrections into specialized local AI models."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Rana Jahanzaib" }]
keywords = ["local-first", "machine-learning", "mlx", "feedback", "model-evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "typer>=0.15,<1", "scikit-learn>=1.6,<2", "psutil>=6,<8", "python-multipart>=0.0.20,<1"
]

[project.urls]
Homepage = "https://github.com/ranajahanzaib/llm-feedback-finetuning-pipeline"
Repository = "https://github.com/ranajahanzaib/llm-feedback-finetuning-pipeline"
Issues = "https://github.com/ranajahanzaib/llm-feedback-finetuning-pipeline/issues"
Changelog = "https://github.com/ranajahanzaib/llm-feedback-finetuning-pipeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mlx = ["mlx>=0.32.4,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'", "mlx-lm[train]>=0.32.2,<0.33; platform_system == 'Darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8,<9", "httpx2>=2,<3", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-psutil>=7,<8"]

[project.scripts]
llm-feedback-finetuning-pipeline = "llm_feedback_finetuning_pipeline.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_feedback_finetuning_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_feedback_finetuning_pipeline"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "huggingface_hub", "huggingface_hub.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
